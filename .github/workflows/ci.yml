name: Community GPL build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source build dependencies
        run: brew install cmake ninja qtbase qtdeclarative qtsvg qtgraphs qtconnectivity qtserialport qt5compat qttools
      - name: Build GPL application
        run: ./scripts/build-community-macos.sh
      - name: Verify project examples
        run: node scripts/test-community-projects.js
      - name: Virtual UART integration test
        run: python3 scripts/test-community-uart.py
      - name: Package community application
        run: ./scripts/package-community-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Serial-Scope-macOS
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
